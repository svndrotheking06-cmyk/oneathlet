<body>

<style>
:root{
  --page:#FFF8F2; --surface:#FFFFFF; --ink:#2B1A14; --muted:#7D655A; --line:#F4DDD1;
  --coral:#EF4F2B; --orange:#FF9A3C; --coral-soft:#FFE4DA;
  --display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(14px,env(safe-area-inset-top)) clamp(16px,4vw,40px) 14px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.brand b{font-weight:800}.brand span{color:var(--coral)}
.brand svg{width:28px;height:28px;flex:none}
.right{display:flex;align-items:center;gap:8px}
.start{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:800;font-size:.92rem;color:#FFFFFF;background:linear-gradient(135deg,var(--orange),var(--coral));box-shadow:0 12px 24px -14px var(--coral);cursor:pointer;transition:transform .15s}
.start:hover{transform:translateY(-1px)}
.langsel{display:inline-flex;align-items:center;font-weight:700;font-size:.9rem}
.langsel select{border:0;background:none;font:inherit;font-weight:700;color:var(--ink);padding:5px 2px;cursor:pointer}
.hero{display:grid;align-content:center;justify-items:center;text-align:center;gap:18px;padding:24px clamp(16px,6vw,80px) 64px;max-width:1080px;width:100%;margin:0 auto}
.kick{background:var(--coral-soft);color:var(--coral);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;padding:6px 12px;border-radius:999px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,10vw,6rem);line-height:1;letter-spacing:-.045em;max-width:12ch;text-wrap:balance;margin-inline:auto}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--orange),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-size:clamp(1.1rem,3vw,1.5rem);font-weight:700;color:var(--muted);max-width:30ch;text-wrap:balance;margin-inline:auto}
.sub b{color:var(--ink)}
.goog-te-banner-frame,.skiptranslate>iframe,#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
body{top:0!important}
font[style]{background:none!important;box-shadow:none!important}
@media (max-width:420px){.start{padding:9px 14px;font-size:.86rem}.brand{font-size:.95rem}.brand svg{width:24px;height:24px}}
</style>

      <option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="de">DE</option><option value="it">IT</option><option value="pt">PT</option><option value="nl">NL</option><option value="ar">AR</option><option value="tr">TR</option>
    </select></label>
  </div>
</header>

<main class="hero">
  <h1>Votre objectif <em>en un clic.</em></h1>
  <p class="sub">Perdez du poids en mangeant <b>mieux</b>, pas en mangeant <b>moins</b>.</p>
</main>

<script>
/* Langue : traduction automatique (Google Traduction) mémorisée dans un cookie */
(function(){
  const sel=document.getElementById('langSel'),codes=[...sel.options].map(o=>o.value);
  const m=document.cookie.match(/(?:^|; )googtrans=\/fr\/([a-z-]+)/),LANG=m&&codes.includes(m[1])?m[1]:'fr';
  sel.value=LANG;document.documentElement.lang=LANG;
  sel.addEventListener('change',()=>{
    const v=sel.value,parts=location.hostname.split('.'),root=parts.length>1?'.'+parts.slice(-2).join('.'):'';
    const set=(val,exp)=>{document.cookie='googtrans='+val+';path=/'+exp;if(root)document.cookie='googtrans='+val+';path=/;domain='+root+exp};
    if(v==='fr')set('','; expires=Thu, 01 Jan 1970 00:00:00 GMT');else set('/fr/'+v,'; max-age=31536000');
    location.reload();
  });
  if(LANG==='fr'||window.claude)return;
  const d=document.createElement('div');d.id='google_translate_element';d.hidden=true;document.body.appendChild(d);
  window.googleTranslateElementInit=function(){try{new google.translate.TranslateElement({pageLanguage:'fr',autoDisplay:false},'google_translate_element')}catch(e){}};
  const sc=document.createElement('script');sc.src='https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';sc.async=true;document.head.appendChild(sc);
})();
</script>
